name: AirPodsHRBridge
options:
  bundleIdPrefix: com.aplikace
  deploymentTarget:
    iOS: "16.0"
targets:
  AirPodsHRBridge:
    type: application
    platform: iOS
    sources:
      - AirPodsHRBridge
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aplikace.AirPodsHRBridge
      GENERATE_INFOPLIST_FILE: YES
    info:
      properties:
        NSHealthShareUsageDescription: "Čtení tepové frekvence z AirPods."
        NSBluetoothAlwaysUsageDescription: "Vysílání tepové frekvence přes Bluetooth."
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
          - processing
